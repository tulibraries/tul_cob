name: Update APK Pins

on:
  schedule:
    # Twice daily at 09:00 and 21:00 UTC
    - cron: "0 9,21 * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update_apk_pins:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Update pinned apk versions
        run: ruby .github/scripts/update_pinned_apk_versions.rb
        env:
          APK_CHECK_BASE_IMAGE: ruby:4.0-alpine
          APK_UPDATE_SUMMARY_PATH: /tmp/apk-update-summary.md

      - name: Create pull request
        id: create-pull-request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.AUTO_PR_TOKEN }}
          add-paths: .docker/app/Dockerfile
          branch: chore/update-apk-pins
          commit-message: "Update pinned apk packages"
          title: "Update pinned apk packages"
          body-path: /tmp/apk-update-summary.md
          delete-branch: true

      - name: "Enable auto-merge"
        if: "steps.create-pull-request.outputs.pull-request-number != ''"
        run: "gh pr merge --auto --squash \"$PR_URL\""
        env:
          PR_URL: "${{ steps.create-pull-request.outputs.pull-request-url }}"
          GH_TOKEN: "${{ secrets.AUTO_PR_TOKEN }}"
